# Netlify serves the static export of the WordPress front page (see README).
[build]
  publish = "site"
  command = ""

# Prototype: keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The v2 preview now lives at the root; keep old /v2/ links working.
[[redirects]]
  from = "/v2/*"
  to = "/"
  status = 301
